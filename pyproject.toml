[project]
name = "sre-agent"
version = "0.1.0"
description = "Autonomous SRE agent that investigates Kubernetes incidents and proposes remediation behind a human approval gate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orchestration + LLM
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "anthropic>=0.40",
    # Cluster + metrics access (read-only)
    "kubernetes>=31",
    "httpx>=0.27",
    # Config + models
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # Observability of the agent itself
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    # CLI niceties
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]
dashboard = [
    "streamlit>=1.38",
]
alerts = [
    # `sre-agent listen` — Alertmanager webhook receiver (Phase 9)
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
sre-agent = "sre_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
