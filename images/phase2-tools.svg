<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="t">Phase 2 — the read-only tools</title>
<desc id="d">Phase 2 builds five typed read-only tools: get_workload_status, get_pod_events, get_pod_logs, get_rollout_history, and query_prometheus. Each replaces a manual kubectl or PromQL command and returns structured facts. The first four use the read-only Kubernetes client; query_prometheus uses the Prometheus HTTP API. The Phase 3 agent loop calls these tools.</desc>
<style>
  .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3;}
  .hdr{fill:#eef2ff;}
  .name{font:700 10.5px ui-monospace,Menlo,monospace;fill:#4338ca;}
  .repl{font:italic 8.5px system-ui;fill:#64748b;}
  .lbl{font:600 9px system-ui;fill:#475569;}
  .val{font:8.7px system-ui;fill:#0f172a;}
  .h1{font:700 16px system-ui;fill:#0f172a;}
  .h2{font:400 11px system-ui;fill:#475569;}
  .muted{font:400 9px system-ui;fill:#64748b;}
  .arw{stroke:#94a3b8;stroke-width:1.3;fill:none;}
  .src{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.8;}
  .src2{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3;}
  .srch{font:700 11px system-ui;fill:#4338ca;}
  .srch2{font:700 11px system-ui;fill:#0f172a;}
  .srcs{font:400 9px system-ui;fill:#475569;}
</style>
<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker></defs>

<rect x="1" y="1" width="958" height="428" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="30" y="32" class="h1">Phase 2 — the read-only tools (the agent's hands)</text>
<text x="31" y="53" class="h2">Turn each manual move into a typed Python function that returns structured facts (not raw text).</text>

<rect x="350" y="70" width="260" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<text x="480" y="88" text-anchor="middle" font="600 11px system-ui" fill="#475569" font-weight="600" font-size="11">Agent loop · Phase 3 (next)</text>
<text x="480" y="103" text-anchor="middle" class="muted">decides which tool to call</text>
<path d="M480,112 L480,138" class="arw" marker-end="url(#a2)"/>
<text x="492" y="130" class="muted" font-style="italic">calls during “Gather”</text>

<!-- cards -->
<g>
  <g>
    <rect class="card" x="19" y="146" width="170" height="112" rx="8"/>
    <rect class="hdr"  x="19" y="146" width="170" height="26" rx="8"/>
    <text x="104" y="164" text-anchor="middle" class="name">get_workload_status</text>
    <text x="30" y="192" class="repl">← kubectl get pods/deploy</text>
    <text x="30" y="214" class="lbl">returns:</text>
    <text x="30" y="230" class="val">status · restarts ·</text>
    <text x="30" y="243" class="val">replicas · ready</text>
  </g>
  <g>
    <rect class="card" x="207" y="146" width="170" height="112" rx="8"/>
    <rect class="hdr"  x="207" y="146" width="170" height="26" rx="8"/>
    <text x="292" y="164" text-anchor="middle" class="name">get_pod_events</text>
    <text x="218" y="192" class="repl">← kubectl describe / events</text>
    <text x="218" y="214" class="lbl">returns:</text>
    <text x="218" y="230" class="val">reason · message ·</text>
    <text x="218" y="243" class="val">timestamps · count</text>
  </g>
  <g>
    <rect class="card" x="395" y="146" width="170" height="112" rx="8"/>
    <rect class="hdr"  x="395" y="146" width="170" height="26" rx="8"/>
    <text x="480" y="164" text-anchor="middle" class="name">get_pod_logs</text>
    <text x="406" y="192" class="repl">← kubectl logs --previous</text>
    <text x="406" y="214" class="lbl">returns:</text>
    <text x="406" y="230" class="val">log lines (current</text>
    <text x="406" y="243" class="val">+ previous crash)</text>
  </g>
  <g>
    <rect class="card" x="583" y="146" width="170" height="112" rx="8"/>
    <rect class="hdr"  x="583" y="146" width="170" height="26" rx="8"/>
    <text x="668" y="164" text-anchor="middle" class="name">get_rollout_history</text>
    <text x="594" y="192" class="repl">← kubectl rollout history</text>
    <text x="594" y="214" class="lbl">returns:</text>
    <text x="594" y="230" class="val">revisions · what</text>
    <text x="594" y="243" class="val">changed · image Δ</text>
  </g>
  <g>
    <rect class="card" x="771" y="146" width="170" height="112" rx="8"/>
    <rect class="hdr"  x="771" y="146" width="170" height="26" rx="8"/>
    <text x="856" y="164" text-anchor="middle" class="name">query_prometheus</text>
    <text x="782" y="192" class="repl">← PromQL (HTTP API)</text>
    <text x="782" y="214" class="lbl">returns:</text>
    <text x="782" y="230" class="val">metric series:</text>
    <text x="782" y="243" class="val">error-rate · latency</text>
  </g>
</g>

<g class="arw" marker-end="url(#a2)">
<path d="M104,258 L200,318"/>
<path d="M292,258 L300,318"/>
<path d="M480,258 L400,318"/>
<path d="M668,258 L470,318"/>
<path d="M856,258 L856,318"/>
</g>

<rect class="src"  x="19"  y="322" width="620" height="52" rx="8"/>
<text x="329" y="345" text-anchor="middle" class="srch">Read-only K8s client (k8s.py + sre-agent.kubeconfig)  →  Kubernetes API</text>
<text x="329" y="362" text-anchor="middle" class="srcs">view RBAC — get / list / watch only · no writes · no secrets</text>

<rect class="src2" x="771" y="322" width="170" height="52" rx="8"/>
<text x="856" y="345" text-anchor="middle" class="srch2">Prometheus</text>
<text x="856" y="362" text-anchor="middle" class="srcs">HTTP API · PromQL</text>

<text x="30" y="398" class="muted" font-style="italic">Each tool: typed inputs/outputs (Pydantic) · structured facts, not raw text · one OpenTelemetry span per call.</text>
</svg>
