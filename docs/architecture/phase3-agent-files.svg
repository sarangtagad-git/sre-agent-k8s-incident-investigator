<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="t">The five files of the agent package and how they collaborate</title>
<desc id="d">__init__.py is the public entry point that calls graph.py, the orchestrator. graph.py runs a LangGraph state machine and a Claude tool loop, using schemas.py for data shapes, prompts.py for instructions, and tools_bridge.py to expose and dispatch the read-only Phase-2 tools, which read the cluster and Prometheus.</desc>
<style>
  .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3;}
  .acc{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;}
  .ext{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:5 3;}
  .name{font:700 12.5px ui-monospace,Menlo,monospace;fill:#0f172a;}
  .nameA{font:700 13px ui-monospace,Menlo,monospace;fill:#3730a3;}
  .role{font:600 10px system-ui;fill:#475569;}
  .sub{font:400 9px system-ui;fill:#64748b;}
  .h1{font:700 16px system-ui;fill:#0f172a;}
  .h2{font:400 11px system-ui;fill:#475569;}
  .arw{stroke:#94a3b8;stroke-width:1.5;fill:none;}
  .lbl{font:italic 9px system-ui;fill:#64748b;}
  .cap{font:400 10px system-ui;fill:#475569;}
</style>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
<marker id="a2" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#94a3b8"/></marker>
</defs>

<rect x="1" y="1" width="898" height="498" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="28" y="32" class="h1">The agent package — five files, one investigation</text>
<text x="29" y="52" class="h2">A conductor (graph.py) drives Claude and the tools, using shapes, instructions, and an adapter.</text>

<!-- __init__ -->
<rect class="box" x="310" y="66" width="250" height="50" rx="9"/>
<text x="435" y="88" text-anchor="middle" class="name">__init__.py</text>
<text x="435" y="104" text-anchor="middle" class="sub">public API · front door · investigate(incident)</text>
<path class="arw" d="M435,116 L435,138" marker-end="url(#a)"/>

<!-- graph.py (accent) -->
<rect class="acc" x="250" y="140" width="290" height="66" rx="10"/>
<text x="395" y="166" text-anchor="middle" class="nameA">graph.py</text>
<text x="395" y="182" text-anchor="middle" class="role">the orchestrator (conductor)</text>
<text x="395" y="196" text-anchor="middle" class="sub">LangGraph: gather (ReAct loop) → report</text>

<!-- Claude API -->
<rect class="ext" x="580" y="146" width="290" height="54" rx="9"/>
<text x="725" y="168" text-anchor="middle" class="name" fill="#334155">Claude  (Anthropic SDK)</text>
<text x="725" y="184" text-anchor="middle" class="sub">adaptive thinking · tool use · messages.parse</text>
<path class="arw" d="M540,173 L578,173" marker-end="url(#a)" marker-start="url(#a2)"/>
<text x="559" y="164" text-anchor="middle" class="lbl">asks ⇄ tool_use</text>

<!-- three supporting modules -->
<rect class="box" x="24"  y="256" width="262" height="80" rx="9"/>
<text x="155" y="280" text-anchor="middle" class="name">schemas.py</text>
<text x="155" y="297" text-anchor="middle" class="role">data shapes &amp; state (the vocabulary)</text>
<text x="155" y="313" text-anchor="middle" class="sub">AgentState · IncidentContext</text>
<text x="155" y="326" text-anchor="middle" class="sub">RCAReport · Remediation</text>

<rect class="box" x="318" y="256" width="262" height="80" rx="9"/>
<text x="449" y="280" text-anchor="middle" class="name">prompts.py</text>
<text x="449" y="297" text-anchor="middle" class="role">the instructions (the script)</text>
<text x="449" y="313" text-anchor="middle" class="sub">SYSTEM_PROMPT (the SRE method)</text>
<text x="449" y="326" text-anchor="middle" class="sub">render_incident()</text>

<rect class="box" x="612" y="256" width="262" height="80" rx="9"/>
<text x="743" y="280" text-anchor="middle" class="name">tools_bridge.py</text>
<text x="743" y="297" text-anchor="middle" class="role">tool adapter (the hands' interface)</text>
<text x="743" y="313" text-anchor="middle" class="sub">ANTHROPIC_TOOLS (schemas)</text>
<text x="743" y="326" text-anchor="middle" class="sub">execute_tool() → dispatch</text>

<!-- graph -> three (fan) -->
<g class="arw" marker-end="url(#a)">
<path d="M340,206 C270,230 200,236 160,254"/>
<path d="M400,206 L445,254"/>
<path d="M470,206 C560,232 660,238 730,254"/>
</g>
<text x="250" y="238" class="lbl">uses</text>

<!-- tools_bridge -> phase2/cluster -->
<rect class="ext" x="560" y="384" width="314" height="52" rx="9"/>
<text x="717" y="406" text-anchor="middle" class="name" fill="#334155">Phase-2 read-only tools</text>
<text x="717" y="421" text-anchor="middle" class="sub">→ k8s API / Prometheus → the cluster</text>
<path class="arw" d="M743,336 L730,382" marker-end="url(#a)"/>
<text x="752" y="362" class="lbl">runs</text>

<text x="28" y="404" class="cap" font-weight="700">Film-crew analogy:</text>
<text x="28" y="420" class="cap">graph.py = director · prompts.py = the script · schemas.py = the shared vocabulary ·</text>
<text x="28" y="434" class="cap">tools_bridge.py = the camera/lighting operators · __init__.py = the box-office doors.</text>
<text x="28" y="458" class="cap" font-style="italic" fill="#64748b">Safety throughout: tools_bridge only wires read-only tools; the proposed fix is data in an RCAReport, never executed.</text>
</svg>
