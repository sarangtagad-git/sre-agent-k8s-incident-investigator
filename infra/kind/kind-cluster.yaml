# Multi-node kind cluster for the K8s Incident Investigator project.
# 1 control-plane + 2 workers → production-fidelity events/conditions so the
# agent has realistic signals (node pressure, scheduling, rollouts) to reason over.
#
# Create:  kind create cluster --name sre-lab --config kind-cluster.yaml
# Delete:  kind delete cluster --name sre-lab
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-lab
nodes:
  - role: control-plane
    # K8s v1.33.12 node image (shipped/validated by kind v0.32.0). Pinned by digest
    # for reproducibility — from that kind release's notes, not guessed.
    # Chosen over 1.34 because 1.33 uses the more disk-tolerant etcd 3.5 line;
    # 1.34's etcd 3.6 couldn't bootstrap within kubeadm's timeout on this WSL2 disk.
    image: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
    # Expose an ingress-ready control-plane so we can add an ingress controller
    # later (e.g. to reach Grafana) without recreating the cluster.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      # Slow WSL2/Docker disk makes etcd fsync latency ~1s, which stalls control-plane
      # bootstrap past kubeadm's timeout. This lab cluster is disposable, so disable
      # etcd fsync to remove the bottleneck. (Never do this on a real/persistent cluster.)
      - |
        kind: ClusterConfiguration
        etcd:
          local:
            extraArgs:
              unsafe-no-fsync: "true"
    # Host ports chosen to avoid clashes with other local services
    # (e.g. Airflow already holds 8080).
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
      - containerPort: 443
        hostPort: 8444
        protocol: TCP
  - role: worker
    image: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
  - role: worker
    image: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
