# Helm values for kube-prometheus-stack on the k3d/k3s `sre-lab` cluster.
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   kubectl create namespace monitoring
#   helm install kps prometheus-community/kube-prometheus-stack \
#     -n monitoring -f kube-prometheus-stack.values.yaml
#
# k3s embeds kube-controller-manager / kube-scheduler / etcd(kine) / kube-proxy in the
# single k3s process and does not expose their /metrics on the standard ports/bind
# addresses. Leaving these enabled just yields permanently-"down" scrape targets, so we
# disable them. Node/kubelet/cAdvisor + kube-state-metrics + app metrics still work fully.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# Keep it lean for a local lab on a spinning HDD. Data is emptyDir (non-persistent) —
# fine for a disposable lab and avoids PVC write pressure on the HDD.
prometheus:
  prometheusSpec:
    retention: 3d
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  # Phase 9: route boutique alerts to the local `sre-agent listen` webhook (the agent
  # auto-investigates, propose-only — see docs/alerts-plan.md). Setting `config`
  # REPLACES the chart default, so the default "null" receiver + Watchdog mute are
  # reproduced here.
  # NOTE: this cluster's k3d does NOT inject host.k3d.internal; what does resolve —
  # via CoreDNS forwarding to Docker Desktop's embedded DNS — is host.docker.internal
  # (verified from the alertmanager pod, 2026-07-25).
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: sre-agent
          matchers:
            - namespace = "boutique"
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          # Short on purpose. With send_resolved=false Alertmanager dedups a re-fired
          # identical alert against its notification log until repeat_interval passes
          # (a resolve alone doesn't reset it — verified live 2026-07-25 when a
          # re-staged incident produced no second webhook under 4h). The agent's own
          # 30m cooldown + daily cap are the real spend gate, so re-posting often is
          # safe and keeps the lab responsive.
          repeat_interval: 15m
    receivers:
      - name: "null"
      - name: sre-agent
        webhook_configs:
          - url: "http://host.docker.internal:9095/alerts"
            send_resolved: false  # the agent acts on firing only

grafana:
  # Default login is admin / prom-operator — pinned here so we know it.
  adminPassword: prom-operator
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# node-exporter + kube-state-metrics keep their defaults (lightweight).
